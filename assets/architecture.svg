<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="gdbot architecture — one interface, two swappable backends">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1e"/>
      <stop offset="1" stop-color="#05060d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b96"/>
    </marker>
    <style>
      .box   { rx: 12; }
      .lbl   { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-weight: 700; }
      .sub   { font-family: 'Segoe UI', system-ui, sans-serif; }
      .now   { fill: #7CFFB2; }
      .later { fill: #a78bfa; }
    </style>
  </defs>

  <rect width="1000" height="440" fill="url(#abg)"/>
  <text x="40" y="52" class="lbl" font-size="24" fill="#e6ecf7">architecture</text>
  <text x="40" y="78" class="sub" font-size="15" fill="#8091b3">one interface, two swappable backends — the learning code never changes</text>

  <!-- learners -->
  <g>
    <rect x="40" y="150" width="200" height="66" rx="12" fill="#10203a" stroke="#22c55e" stroke-width="2"/>
    <text x="140" y="182" text-anchor="middle" class="lbl" font-size="18" fill="#e6ecf7">NEAT</text>
    <text x="140" y="202" text-anchor="middle" class="sub" font-size="12"><tspan class="now">neuroevolution · now</tspan></text>

    <rect x="40" y="252" width="200" height="66" rx="12" fill="#160f2a" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="140" y="284" text-anchor="middle" class="lbl" font-size="18" fill="#e6ecf7">PPO / DQN</text>
    <text x="140" y="304" text-anchor="middle" class="sub" font-size="12"><tspan class="later">reinforcement · later</tspan></text>
  </g>

  <!-- interface -->
  <rect x="392" y="176" width="216" height="116" rx="14" fill="#132038" stroke="#8be9fd" stroke-width="2.5"/>
  <text x="500" y="222" text-anchor="middle" class="lbl" font-size="22" fill="#8be9fd">GDEnv</text>
  <text x="500" y="248" text-anchor="middle" class="sub" font-size="13" fill="#c7d2e8">reset() · step(action)</text>
  <text x="500" y="270" text-anchor="middle" class="sub" font-size="12" fill="#7f8fb3">observation → jump</text>

  <!-- backends -->
  <rect x="760" y="120" width="210" height="86" rx="12" fill="#10203a" stroke="#22c55e" stroke-width="2"/>
  <text x="865" y="152" text-anchor="middle" class="lbl" font-size="18" fill="#e6ecf7">SimEnv</text>
  <text x="865" y="173" text-anchor="middle" class="sub" font-size="12" fill="#c7d2e8">pygame · headless · fast</text>
  <text x="865" y="191" text-anchor="middle" class="sub" font-size="12"><tspan class="now">deterministic · built ✓</tspan></text>

  <rect x="760" y="262" width="210" height="86" rx="12" fill="#160f2a" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="865" y="294" text-anchor="middle" class="lbl" font-size="18" fill="#e6ecf7">LiveEnv</text>
  <text x="865" y="315" text-anchor="middle" class="sub" font-size="12" fill="#c7d2e8">real Geometry Dash</text>
  <text x="865" y="333" text-anchor="middle" class="sub" font-size="12"><tspan class="later">pymem + SendInput · Phase 2</tspan></text>

  <!-- edges -->
  <g fill="none" stroke="#5b6b96" stroke-width="2">
    <path d="M240 183 H392" marker-end="url(#arrow)"/>
    <path d="M240 285 H360 Q380 285 380 265 V250" marker-end="url(#arrow)"/>
    <path d="M608 210 Q690 210 700 180 L760 163" marker-end="url(#arrow)"/>
    <path d="M608 258 Q690 258 700 290 L760 305" marker-end="url(#arrow)"/>
  </g>

  <text x="500" y="400" text-anchor="middle" class="sub" font-size="13" fill="#6b7ba0">Train the network against SimEnv at 1000× speed, then swap in LiveEnv — same brain, no code changes.</text>
</svg>
