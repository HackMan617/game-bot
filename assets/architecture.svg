<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="gdbot architecture — the game waits for the agent, and the viewer never touches the training loop">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1e"/>
      <stop offset="1" stop-color="#05060d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b96"/>
    </marker>
    <marker id="arrowdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3c4762"/>
    </marker>
    <style>
      .lbl  { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-weight: 700; }
      .sub  { font-family: 'Segoe UI', system-ui, sans-serif; }
      .note { font-family: 'Segoe UI', system-ui, sans-serif; fill: #7183a8; }
    </style>
  </defs>

  <rect width="1000" height="560" fill="url(#abg)"/>
  <text x="40" y="52" class="lbl" font-size="24" fill="#e6ecf7">architecture</text>
  <text x="40" y="78" class="sub" font-size="15" fill="#8091b3">the game waits for the agent — and the viewer never touches the training loop</text>

  <!-- ================= band 1: the game and the wire ================= -->
  <rect x="40" y="120" width="250" height="112" rx="12" fill="#101a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="165" y="150" text-anchor="middle" class="lbl" font-size="17" fill="#e6ecf7">GeometryDash.exe</text>
  <text x="165" y="174" text-anchor="middle" class="sub" font-size="12.5" fill="#8fd8ff">geode-mod · GDBot Bridge v5</text>
  <text x="165" y="196" text-anchor="middle" class="note" font-size="11.5">hooks PlayLayer::postUpdate</text>
  <text x="165" y="214" text-anchor="middle" class="note" font-size="11.5">builds a 24×16×4 occupancy grid</text>

  <line x1="292" y1="168" x2="366" y2="168" stroke="#5b6b96" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="329" y="158" text-anchor="middle" class="note" font-size="10.5">frame</text>
  <line x1="366" y1="196" x2="292" y2="196" stroke="#5b6b96" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="329" y="216" text-anchor="middle" class="note" font-size="10.5">action</text>

  <rect x="368" y="120" width="234" height="112" rx="12" fill="#101a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="485" y="150" text-anchor="middle" class="lbl" font-size="17" fill="#e6ecf7">gdbot/bridge.py</text>
  <text x="485" y="174" text-anchor="middle" class="sub" font-size="12.5" fill="#8fd8ff">shared memory + 2 events</text>
  <text x="485" y="196" text-anchor="middle" class="note" font-size="11.5">the mod blocks until we answer,</text>
  <text x="485" y="214" text-anchor="middle" class="note" font-size="11.5">so no frame is ever missed</text>

  <rect x="646" y="120" width="314" height="112" rx="12" fill="#0e1626" stroke="#2b3a57" stroke-width="1.5"/>
  <text x="803" y="150" text-anchor="middle" class="lbl" font-size="15" fill="#cfd9ea">why this is fast</text>
  <text x="803" y="176" text-anchor="middle" class="note" font-size="12">one answered frame = one fixed 1/step_hz</text>
  <text x="803" y="194" text-anchor="middle" class="note" font-size="12">slice of game time = one decision</text>
  <text x="803" y="217" text-anchor="middle" class="sub" font-size="11.5" fill="#7CFFB2">speed ×N buys wall clock, not a different policy</text>

  <!-- ================= band 2: the contract ================= -->
  <line x1="485" y1="232" x2="485" y2="274" stroke="#5b6b96" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="276" width="310" height="88" rx="12" fill="#132038" stroke="#8be9fd" stroke-width="2.5"/>
  <text x="485" y="305" text-anchor="middle" class="lbl" font-size="19" fill="#8be9fd">GDEnv</text>
  <text x="485" y="328" text-anchor="middle" class="sub" font-size="12.5" fill="#c7d2e8">Obs = grid(4,16,24) + 17 scalars</text>
  <text x="485" y="349" text-anchor="middle" class="note" font-size="11.5">no x, no percent — it cannot read the clock</text>

  <rect x="72" y="289" width="212" height="62" rx="10" fill="#0e1a2c" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="178" y="315" text-anchor="middle" class="lbl" font-size="14" fill="#e6ecf7">LiveEnv</text>
  <text x="178" y="335" text-anchor="middle" class="note" font-size="11.5">real Geometry Dash</text>
  <line x1="284" y1="320" x2="326" y2="320" stroke="#5b6b96" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="686" y="289" width="212" height="62" rx="10" fill="#0e1a2c" stroke="#22c55e" stroke-width="1.5"/>
  <text x="792" y="315" text-anchor="middle" class="lbl" font-size="14" fill="#e6ecf7">SimEnv</text>
  <text x="792" y="335" text-anchor="middle" class="note" font-size="11.5">same contract, no game</text>
  <line x1="686" y1="320" x2="644" y2="320" stroke="#5b6b96" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= band 3: the agent ================= -->
  <line x1="485" y1="364" x2="485" y2="404" stroke="#5b6b96" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="298" y="406" width="374" height="94" rx="12" fill="#160f2a" stroke="#a78bfa" stroke-width="2"/>
  <text x="485" y="436" text-anchor="middle" class="lbl" font-size="17" fill="#e6ecf7">ConvActorCritic + PPO</text>
  <text x="485" y="459" text-anchor="middle" class="sub" font-size="12.5" fill="#c4b5fd">3 conv layers → dense 256 → hold / release</text>
  <text x="485" y="481" text-anchor="middle" class="note" font-size="11.5">train.py — headless, and it never draws anything</text>

  <path d="M672 453 H758" stroke="#3c4762" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowdim)"/>
  <rect x="760" y="406" width="200" height="94" rx="12" fill="#0e1626" stroke="#2b3a57" stroke-width="1.5"/>
  <text x="860" y="436" text-anchor="middle" class="lbl" font-size="15" fill="#cfd9ea">viewer</text>
  <text x="860" y="458" text-anchor="middle" class="note" font-size="11.5">websocket → browser</text>
  <text x="860" y="480" text-anchor="middle" class="sub" font-size="11.5" fill="#7CFFB2">only while watched</text>

  <text x="40" y="528" class="note" font-size="12">The learning code talks only to GDEnv, so Sim → Live needs no change to the network or the training loop.</text>
  <text x="40" y="546" class="note" font-size="12">Close the browser tab and training returns to full speed — with nobody connected, the trainer skips capture entirely.</text>
</svg>
